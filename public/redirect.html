<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirection vers l'application</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    a {
      color: #2563eb;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ouverture de l'application...</h1>
    <p id="status">Redirection en cours.</p>
    <p><a id="fallback-link" href="#">Ouvrir manuellement</a></p>
  </div>
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const targetUrl = urlParams.get('url');
      const fallbackLink = document.getElementById('fallback-link');
      const status = document.getElementById('status');

      if (!targetUrl) {
        window.location.href = '/';
        return;
      }

      fallbackLink.href = targetUrl;
      fallbackLink.textContent = targetUrl;

      const appScheme = 'macommunaute://open?url=' + encodeURIComponent(targetUrl);
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isMobile = /android|iphone|ipad|ipod/i.test(userAgent);

      if (!isMobile) {
        window.location.replace(targetUrl);
        return;
      }

      status.textContent = "Tentative d'ouverture de l'application...";
      window.location.href = appScheme;

      setTimeout(function () {
        status.textContent = "Ouverture dans le navigateur...";
        window.location.replace(targetUrl);
      }, 700);
    })();
  </script>
</body>
</html>
