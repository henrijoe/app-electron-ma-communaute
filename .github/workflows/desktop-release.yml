
name: Desktop release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows executable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 20.14.0
        uses: actions/setup-node@v5
        with:
          node-version: 20.14.0
          cache: yarn

      - name: Read package version
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./package.json').version")"
          previous_version=""
          current_tag="v$current_version"

          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            previous_version="$(git show "$BEFORE_SHA:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)"
          fi

          git fetch --tags --force

          tag_exists="false"
          if git rev-parse "$current_tag" >/dev/null 2>&1; then
            tag_exists="true"
          fi

          should_release="false"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$current_version" != "$previous_version" ] || [ "$tag_exists" != "true" ]; then
            should_release="true"
          fi

          echo "current=$current_version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous_version" >> "$GITHUB_OUTPUT"
          echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Check existing release tag
        id: tag
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Le tag ${{ steps.version.outputs.tag }} existe deja. La release n'est pas reconstruite."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Une release publiee sans aucun fichier casse la mise a jour automatique de
      # TOUS les utilisateurs : electron-updater interroge la release la plus
      # recente et y cherche "latest.yml". S'il ne l'y trouve pas, il abandonne --
      # meme si une release complete existe juste en dessous. C'est ce qui est
      # arrive avec la v1.0.11, restee en tete et vide.
      #
      # On supprime donc ces coquilles. Le filtre est strict : uniquement les
      # releases publiees comptant ZERO fichier. Une release avec ne serait-ce
      # qu'un fichier n'est jamais touchee.
      - name: Remove empty published releases
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"

          echo "$releases" \
            | node -e "
                let d='';
                process.stdin.on('data', (c) => { d += c; });
                process.stdin.on('end', () => {
                  const vides = JSON.parse(d)
                    .filter((r) => !r.draft && (r.assets || []).length === 0)
                    .map((r) => r.id + ' ' + r.tag_name);
                  process.stdout.write(vides.join('\n'));
                });
              " > vides.txt

          if [ ! -s vides.txt ]; then
            echo "::notice::Aucune release vide a supprimer."
            exit 0
          fi

          while read -r id tag; do
            [ -z "${id:-}" ] && continue
            echo "::warning::Suppression de la release vide $tag (aucun fichier publie)."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            # Le tag part avec elle : laisse seul, il empecherait de republier
            # cette version plus tard.
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done < vides.txt

      - name: Install frontend dependencies
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        run: yarn install --frozen-lockfile

      - name: Prepare embedded backend
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "../server/package.json" ]; then
            npm --prefix ../server install
            npm --prefix ../server run build
            node electron/prepare-backend.cjs
          else
            echo "::notice::Le dossier ../server n'existe pas dans ce checkout. Le backend embarque deja present dans electron/backend sera utilise."
            test -f electron/backend/dist/app.js
            test -f electron/backend/package.json
            npm --prefix electron/backend install --omit=dev
            npm --prefix electron/backend prune --omit=dev
            rm -rf \
              electron/backend/node_modules/.cache \
              electron/backend/node_modules/@types \
              electron/backend/node_modules/nodemon \
              electron/backend/node_modules/ts-node \
              electron/backend/node_modules/typescript \
              electron/backend/node_modules/nw \
              electron/backend/node_modules/nwjs-builder-phoenix
            node -e "for (const pkg of ['express','sqlite3','socket.io','cors','bcrypt']) require.resolve(pkg, { paths: ['./electron/backend'] })"
          fi

      - name: Build renderer
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        run: yarn desktop:build:web

      - name: Check embedded backend size
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        shell: powershell
        run: |
          $backendPath = "electron/backend"
          $size = (Get-ChildItem $backendPath -Recurse -File | Measure-Object Length -Sum).Sum
          $sizeMb = [Math]::Round($size / 1MB, 2)

          Write-Host "Taille du backend embarque : $sizeMb Mo"

          if ($sizeMb -gt 250) {
            Write-Error "Le backend embarque est trop lourd pour un packaging fiable ($sizeMb Mo). Verifie les dependances de production."
            exit 1
          }

      - name: Build Windows unpacked app fallback
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >
          yarn electron-builder
          --win
          --dir
          --config.directories.output=release/windows
          --publish never

      - name: Upload Windows unpacked fallback
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ma-communaute-unpacked-v${{ steps.version.outputs.current }}
          path: release/windows/win-unpacked/**
          if-no-files-found: error
          retention-days: 30

      - name: Build and publish GitHub Release
        id: publish_release
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        # L'installeur genere par cette etape (upload compris) approche voire depasse
        # 25 minutes quand la compression est desactivee ("compression": "store") :
        # l'upload d'un fichier de plusieurs centaines de Mo vers GitHub Releases est
        # lent et variable. On a corrige la taille du fichier (voir "compression":
        # "normal" dans package.json), mais on garde une marge genereuse ici au cas
        # ou le runner soit particulierement lent un jour donne.
        timeout-minutes: 40
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >
          yarn electron-builder
          --win
          --config.directories.output=release/windows
          --publish always

      - name: List generated Windows files
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        shell: powershell
        run: |
          if (-not (Test-Path "release/windows")) {
            Write-Error "Le dossier release/windows n'existe pas."
            exit 1
          }

          Write-Host "Fichiers generes :"

          Get-ChildItem "release/windows" -Recurse -File |
            Select-Object FullName, Length

          $executables = @(
            Get-ChildItem "release/windows" `
              -Recurse `
              -File `
              -Filter "*.exe"
          )

          if ($executables.Count -eq 0) {
            Write-Error "Aucun executable Windows n'a ete genere."
            exit 1
          }

          Write-Host "Executables trouves :"

          foreach ($executable in $executables) {
            Write-Host $executable.FullName
          }

      - name: Upload Windows executable
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ma-communaute-v${{ steps.version.outputs.current }}
          path: |
            release/windows/**/*.exe
            release/windows/**/*.zip
            release/windows/**/*.msi
            release/windows/**/*.yml
            release/windows/**/*.blockmap
          if-no-files-found: error
          retention-days: 30

      # IMPORTANT : l'etape "Build and publish GitHub Release" a "continue-on-error: true"
      # pour que l'artefact GitHub Actions ci-dessus reste disponible meme si la
      # publication de la Release echoue (ex: probleme reseau/signature cote GitHub).
      # Mais sans verification explicite APRES l'upload de secours, un echec de
      # publication passait totalement inapercu : le workflow restait "vert" alors que
      # la Release publique se retrouvait vide (aucun .exe, aucun latest.yml) —
      # cassant a la fois le telechargement manuel ET la mise a jour automatique pour
      # tous les utilisateurs (c'est exactement ce qui est arrive avec la release
      # v1.0.8, publiee vide). Ce garde-fou fait donc echouer le job (visible dans
      # l'onglet Actions) des que la publication rate, sans empecher l'artefact de
      # secours d'etre disponible au telechargement depuis le run GitHub Actions.
      # La release est creee en BROUILLON par electron-builder (voir "releaseType":
      # "draft" dans package.json). Un brouillon est invisible pour
      # electron-updater : si l'envoi echoue a mi-chemin, personne n'est casse.
      #
      # On ne la rend publique qu'apres avoir verifie qu'elle contient bien ce
      # qu'il faut. Verifier le code de sortie de l'etape ne suffisait pas : elle
      # pouvait reussir en n'ayant televerse qu'une partie des fichiers.
      - name: Publish the release only if it is complete
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail

          if [ "${{ steps.publish_release.outcome }}" != "success" ]; then
            echo "::error::La construction de la release $TAG a echoue (voir l'etape precedente). L'executable reste telechargeable en artefact GitHub Actions ('ma-communaute-v$VERSION'), mais aucune release publique n'a ete mise a jour."
          fi

          # "releases/tags/{tag}" ne renvoie QUE les releases publiees : un
          # brouillon y est introuvable. On liste donc et on cherche par nom de tag.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100"             | node -e "
                let d='';
                process.stdin.on('data', (c) => { d += c; });
                process.stdin.on('end', () => {
                  const tag = process.env.TAG;
                  const trouvee = JSON.parse(d).find((r) => r.tag_name === tag);
                  process.stdout.write(trouvee ? JSON.stringify(trouvee) : '');
                });
              " > release.json

          if [ ! -s release.json ]; then
            echo "::error::Aucune release $TAG n'a ete creee, meme en brouillon. La mise a jour automatique reste sur la version precedente."
            exit 1
          fi

          # Deux fichiers sont indispensables : l'installateur, et le "latest.yml"
          # que l'application installee lit pour se savoir perimee.
          node -e "
            const r = require('./release.json');
            const noms = (r.assets || []).map((a) => a.name);
            const installateur = noms.some((n) => n.endsWith('.exe'));
            const manifeste = noms.includes('latest.yml');

            console.log('Fichiers publies : ' + (noms.join(', ') || 'AUCUN'));

            if (!installateur || !manifeste) {
              console.log('::error::Release incomplete : ' +
                (installateur ? '' : 'installateur .exe manquant. ') +
                (manifeste ? '' : 'latest.yml manquant. ') +
                'Elle reste en brouillon et ne casse donc pas la mise a jour des utilisateurs.');
              process.exit(1);
            }
          "

          id="$(node -p "require('./release.json').id")"

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false >/dev/null
          echo "::notice::Release $TAG publiee avec son installateur et son latest.yml."

      # Dernier controle, du point de vue de l'application installee : c'est cette
      # adresse exacte qu'interroge electron-updater.
      - name: Check the updater can reach latest.yml
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.yml"
          code=""

          # GitHub met quelques secondes a designer la nouvelle release comme
          # "latest" : sans cette attente, le controle echouait sur une release
          # pourtant complete.
          for tentative in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -L "$url")"
            [ "$code" = "200" ] && break
            echo "Tentative $tentative : $code. Nouvel essai dans 10 s."
            sleep 10
          done

          if [ "$code" != "200" ]; then
            echo "::error::La mise a jour automatique est cassee : $url repond $code au lieu de 200."
            exit 1
          fi

          echo "::notice::La mise a jour automatique fonctionne : $url repond 200."

      - name: Existing version tag
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists == 'true'
        shell: bash
        run: |
          echo "::notice::Le tag ${{ steps.version.outputs.tag }} existe deja. Modifie la version dans package.json pour generer une nouvelle release."

      - name: No version change
        if: steps.version.outputs.should_release != 'true'
        shell: bash
        run: |
          echo "::notice::La version package.json n'a pas change (${{ steps.version.outputs.current }}). Aucune release desktop n'est publiee."
